name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Validate TOML
        run: python -c "import pathlib, tomllib; tomllib.loads(pathlib.Path('pyproject.toml').read_text())"
      - name: Validate YAML
        run: python -c "import pathlib, yaml; [yaml.safe_load(p.read_text()) for p in pathlib.Path('configs').glob('*.yaml')]"
      - name: Validate JSON contracts
        run: python -c "import json, pathlib; [json.load(p.open()) for p in pathlib.Path('contracts').glob('*.json')]"
      - name: Lint
        run: python -m ruff check producer spark dashboard airflow tests
      - name: Run tests when implemented
        shell: bash
        run: |
          if find producer spark dashboard airflow tests -name 'test_*.py' -print -quit | grep -q .; then
            python -m pytest
          else
            echo "No tests implemented yet."
          fi
