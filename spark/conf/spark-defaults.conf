# Local deployment defaults. Application code must receive endpoints and
# checkpoint paths through runtime configuration rather than hard-code them.
spark.master                                      spark://spark-master:7077
spark.app.name                                    transitpulse
spark.sql.session.timeZone                        UTC
spark.sql.shuffle.partitions                      6
spark.default.parallelism                         6
spark.serializer                                  org.apache.spark.serializer.KryoSerializer
spark.streaming.stopGracefullyOnShutdown          true
spark.sql.streaming.forceDeleteTempCheckpointLocation false
spark.sql.streaming.stateStore.providerClass      org.apache.spark.sql.execution.streaming.state.RocksDBStateStoreProvider
spark.sql.streaming.stateStore.rocksdb.boundedMemoryUsage true
spark.sql.streaming.stateStore.rocksdb.maxMemoryUsageMB  256
spark.sql.streaming.stateStore.rocksdb.changelogCheckpointing.enabled true
spark.jars.packages                               org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.0,org.postgresql:postgresql:42.7.13
spark.driver.memory                               1g
spark.executor.memory                             1g
spark.executor.cores                              1
spark.ui.retainedJobs                             100
spark.ui.retainedStages                           100
spark.eventLog.enabled                            false
spark.jars.ivy /opt/transitpulse/.ivy2
